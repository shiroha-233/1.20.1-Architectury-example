plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            client()
            name "NeoForge Client"
            runDir "run/client"
            programArgs "--username", "Player1"
            
            // 确保正确加载 mod
            property "neoforge.enabledGameTestNamespace", "template_mod"
        }
        server {
            server()
            name "NeoForge Server"
            runDir "run/server"
            
            property "neoforge.enabledGameTestNamespace", "template_mod"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
    
    // 排除不需要的文件
    exclude 'META-INF/versions/**'
    
    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()
    
    // 排除 module-info.class 避免 JPMS 冲突
    exclude 'module-info.class'
}


remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'Template Mod',
			'Specification-Vendor'    : 'Template Author',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'Template Author'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.neoforged.net/releases"
        name "NeoForge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
    maven {
        url "https://cursemaven.com"
        name "CurseMaven"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.21.11',
        minecraft_version_range: '[1.21.11,1.22)',
        neoforge_version: project.neoforge_version,
        neoforge_version_range: '[21.11,)',
        loader_version_range: '[4,)',
        mod_id: 'template_mod',
        mod_name: 'Template Mod',
        mod_version: project.version,
        mod_authors: 'Template Author',
        mod_description: 'Template Mod for Architectury'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    // NeoForge 平台
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modImplementation("dev.architectury:architectury-neoforge:19.0.1")
    include("dev.architectury:architectury-neoforge:19.0.1")
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package: keep top-level network package only in common
        }
        resources {
            exclude 'assets/template_mod/lang/*.json'
        }
    }
}
